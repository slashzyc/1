services:
  harborflow:
    build: .
    ports: ["127.0.0.1:3000:3000"]
    environment:
      HOST: 0.0.0.0
      APP_TOKEN: ${APP_TOKEN:?Set APP_TOKEN with at least 24 random characters}
      APP_ORIGIN: ${APP_ORIGIN:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.deepseek.com}
      MODEL_NAME: ${MODEL_NAME:-deepseek-flash}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_TIMEOUT_MS: ${MODEL_TIMEOUT_MS:-60000}
    volumes: ["harborflow-data:/app/data"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes:
  harborflow-data:
